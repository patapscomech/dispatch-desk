<style>

function parseLines(text){
  const lines=String(text).replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return [];
  let col=null;const IT=['item','task','description','step'];
  const first=splitCsv(lines[0]).map(s=>s.trim().toLowerCase());
  if(first.length>1&&first.some(h=>IT.includes(h))){col={item:first.findIndex(h=>IT.includes(h)),sec:first.indexOf('section'),typ:first.indexOf('type')};lines.shift()}
  const out=[];let lastSec=null;

}

function invoiceExport(j,L){
  const b=S.bill,T=invTotals(L),q=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const mdy=d=>{const [y,m,dd]=d.split('-');return m+'/'+dd+'/'+y};
  const memo=j.id+' '+j.title+(b.po?' PO '+b.po:''),name=cust(j.custId).name,site=loc(j.locId).name,isMat=l=>l.kind==='part'||l.kind==='partadd';
  const sd=S.times.filter(x=>x.jobId===j.id).map(x=>x.date).sort().pop()||b.date;
  if(b.fmt==='iif'){
    const rows=['!TRNS\tTRNSTYPE\tDATE\tACCNT\tNAME\tAMOUNT\tDOCNUM\tTERMS\tMEMO','!SPL\tTRNSTYPE\tDATE\tACCNT\tNAME\tAMOUNT\tDOCNUM\tMEMO\tINVITEM\tPRICE\tQNTY','!ENDTRNS',
      ['TRNS','INVOICE',mdy(b.date),'Accounts Receivable',name,T.total.toFixed(2),b.no,b.terms,memo].join('\t')];
    L.forEach(l=>rows.push(['SPL','INVOICE',mdy(b.date),'Sales',name,(-l.amt).toFixed(2),b.no,l.desc,l.item,l.rate.toFixed(2),(-l.qty)].join('\t')));
    if(T.tax)rows.push(['SPL','INVOICE',mdy(b.date),'Sales Tax Payable',name,(-T.tax).toFixed(2),b.no,'Sales tax','','',''].join('\t'));
    rows.push('ENDTRNS');return rows.join('\n');
  }
  return ['InvoiceNo,Customer,InvoiceDate,DueDate,Terms,Location,Memo,Item(Product/Service),ItemDescription,ItemQuantity,ItemRate,ItemAmount,ItemTaxCode,Service Date'].concat(L.map(l=>[b.no,name,mdy(b.date),mdy(dueOf()),b.terms,site,memo,l.item,l.desc,l.qty.toFixed(2),l.rate.toFixed(2),l.amt.toFixed(2),isMat(l)&&T.tax?'TAX':'NON',mdy(sd)].map(q).join(','))).join('\n');

  if(!f.type.startsWith('image/'))return res({name:f.name,src:r.result,kind:'pdf'});
  const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({name:f.name,src:c.toDataURL('image/jpeg',.8),kind:'image'})};

    L.forEach(l=>{if(l.kind==='fixed'){j.billedFixed=(j.billedFixed||0)+l.amt;return}if(l.kind==='pm'){j.pmBilled=true;return}if(l.ids)S.times.forEach(x=>{if(l.ids.includes(x.id))x.invId=b.no});if(l.pid)j.parts.find(p=>p.id===l.pid).invId=b.no;if(l.pids)l.pids.forEach(id=>{j.parts.find(p=>p.id===id).invId=b.no});if(l.kind==='trip')j.tripBilled=true});
    S.invoices.push({no:b.no,jobId:j.id,date:b.date,total:T.total,cust:cust(j.custId).name});toast(b.no+' marked as invoiced');b.jobId=null;b.out='';render()},
  hf:el=>{S.hf=el.dataset.v;render()},
  addEquip:el=>{const px=el.dataset.px,l=el.dataset.loc||val(px+'-loc'),tag=val(px+'-tag').trim();if(!tag)return toast('Enter an equipment tag, like RTU-5.');
    const q={id:uid('q'),locId:l,tag,type:val(px+'-type'),make:val(px+'-make'),model:val(px+'-model'),serial:val(px+'-serial'),area:val(px+'-area'),inst:'',notes:''};S.equipment.push(q);
    const j=curJob();if(px==='ae'&&j)j.equip.push(q.id);toast(tag+' added'+(px==='ae'?' and marked on this call':''));render()},
  delTime:el=>{S.times=S.times.filter(t=>t.id!==el.dataset.id);render()},
  tweek:el=>{S.time.date=addDays(S.time.date,+el.dataset.n);render()},
  pickDay:el=>{S.time.date=el.dataset.d;render()},
  submitWeek:()=>{const wk=mondayOf(S.time.date),en=addDays(wk,6);let n=0;S.times.forEach(t=>{if(t.emp===meId()&&t.date>=wk&&t.date<=en&&t.status==='open'){t.status='submitted';n++}});toast(n+' entries submitted to the office');render()},
  approveRange:()=>{let n=0;S.times.forEach(t=>{if(t.date>=S.ts.from&&t.date<=S.ts.to&&t.status==='submitted'){t.status='approved';n++}});toast(n+' entries approved');render()},
  genExport:()=>{const l=tsEntries();if(!l.length)return toast('No entries match. Approve submitted time or widen the range.');S.ts.out=exportText(l);S.ts.ids=l.map(t=>t.id);render();const o=$('#ts-out');if(o)o.scrollIntoView({block:'nearest'})},
  copyOut:async()=>{const ta=$('#ts-out');try{await navigator.clipboard.writeText(S.ts.out);toast('Copied to clipboard')}catch(e){ta.focus();ta.select();toast('Selected. Press Ctrl or Cmd + C to copy.')}},
  markExported:()=>{S.times.forEach(t=>{if(S.ts.ids.includes(t.id))t.status='exported'});toast(S.ts.ids.length+' entries marked as exported');S.ts.out='';S.ts.ids=[];render()},
  selCust:el=>{S.custSel=el.dataset.id;render()},
  addCust:()=>{const n=val('nc-name').trim();if(!n)return toast('Enter a customer name.');const id=uid('c');S.customers.push({id,name:n});S.custSel=id;render()},
  addLoc:()=>{const n=val('nl-name').trim();if(!n)return toast('Enter a site name.');S.locations.push({id:uid('l'),custId:S.custSel,name:n,addr:val('nl-addr'),notes:val('nl-notes')});render()},
  addContract:()=>{const n=val('nk-name').trim();if(!n)return toast('Enter a contract name.');const g=i=>parseFloat(val(i))||0;
    S.contracts.push({id:uid('k'),custId:S.custSel,name:n,type:val('nk-type'),pw:val('nk-pw')==='1',rates:R(g('nk-F'),g('nk-J'),g('nk-A'),g('nk-H')),ot:g('nk-ot')||1.5,markup:g('nk-mk'),trip:g('nk-trip'),method:val('nk-method'),adS:g('nk-ads'),pm:{basis:'none',locPrices:{},locDefault:0,eqPrices:{}},start:S.today,end:addDays(S.today,364)});toast('Contract added');render()},
  selTpl:el=>{S.tplSel=el.dataset.id;render()},
  delTpl:()=>{if(S.templates.length<2)return toast('Keep at least one template.');S.templates=S.templates.filter(t=>t.id!==S.tplSel);S.tplSel=S.templates[0].id;render()},
  delTplItem:el=>{S.templates.find(t=>t.id===S.tplSel).items.splice(+el.dataset.n,1);render()},
  addTplItem:()=>{const it=parseLines(val('ti-text'));if(!it.length)return;S.templates.find(t=>t.id===S.tplSel).items.push(...it);render()},
  openImport:el=>{S.modal={type:'import',target:el.dataset.target,text:'',name:'',parsed:null};render()},
  impPreview:()=>{const m=S.modal;m.text=val('imp-text');m.name=val('imp-name');m.parsed=parseLines(m.text);render()},
  impSave:()=>{const m=S.modal;m.name=val('imp-name').trim();const items=m.parsed;
    if(m.target==='lib'&&!m.name)return toast('Name the template first.');
    if(m.name){const id=uid('tp');S.templates.push({id,name:m.name,items:items.map(i=>({type:i.type,text:i.text}))});if(m.target==='lib')S.tplSel=id}
    if(m.target==='job'){curJob().checklist.push(...mkCl(items))}
    toast(items.filter(i=>i.type!=='head').length+' items imported');S.modal=null;render()},
  applyTpl:()=>{const t=S.templates.find(x=>x.id===val('cl-tpl'));curJob().checklist.push(...mkCl(t.items));toast(t.name+' applied');render()},
  addClItem:()=>{const it=parseLines(val('cl-new'));if(!it.length)return;curJob().checklist.push(...mkCl(it));render()},
  addTask:()=>{const n=val('tk-name').trim();if(!n)return toast('Name the task.');curJob().tasks.push({id:uid('t'),name:n,budget:parseFloat(val('tk-bud'))||0,assignees:[],start:null,end:null,status:'Not started'});render()},
  addPart:async()=>{const j=curJob(),d=val('pp-desc').trim();if(!d)return toast('Describe the part.');
    const f=document.getElementById('pp-file').files[0];const inv=f?await readAtt(f):null;
    const src=val('pp-src');j.parts.push({id:uid('pa'),desc:d,qty:parseFloat(val('pp-qty'))||1,cost:parseFloat(val('pp-cost'))||0,src,vendor:val('pp-vendor'),by:src==='Purchased by tech'?(isOffice()?'':S.user):'',reimb:val('pp-reimb')==='1',invoice:inv});
    toast(needsInv({src})&&!inv?'Added. Remember to attach the invoice.':'Part added');render()},
  delPart:el=>{const j=curJob();j.parts=j.parts.filter(p=>p.id!==el.dataset.id);render()},
  delPhoto:el=>{const j=curJob();j.photos=j.photos.filter(p=>p.id!==el.dataset.id);render()},
  zoom:el=>{const j=curJob(),id=el.dataset.src,p=j.photos.find(x=>x.id===id),pa=j.parts.find(x=>x.id===id);S.modal={type:'zoom',src:p?p.src:pa.invoice.src};render()}
};
const chg={
  user:el=>{S.user=el.value;S.drawer=null;S.view=isOffice()?'dispatch':'mywork';render()},
  fStatus:el=>{S.f.status=el.value;render()},fCust:el=>{S.f.cust=el.value;render()},
  timeJob:el=>{S.time.job=el.value;S.time.date=val('tv-date')||S.time.date;render()},
  timeEmp:el=>{S.time.emp=el.value;render()},
  tsRange:()=>{S.ts.from=val('ts-from');S.ts.to=val('ts-to');if(S.ts.to<S.ts.from)S.ts.to=S.ts.from;S.ts.out='';render()},
  tsFmt:el=>{S.ts.fmt=el.value;S.ts.out='';render()},tsIncl:el=>{S.ts.incl=el.value;S.ts.out='';render()},tsAgain:el=>{S.ts.again=el.checked;S.ts.out='';render()},
  conRate:el=>{con(el.dataset.id).rates[el.dataset.f]=parseFloat(el.value)||0;toast('Rate updated')},
  conNum:el=>{con(el.dataset.id)[el.dataset.f]=parseFloat(el.value)||0;toast('Updated')},
  jobField:el=>{const j=curJob(),f=el.dataset.f;
    if(f==='status'&&el.value==='Complete'&&clLeft(j)){toast('Finish the checklist first: '+clLeft(j)+' item'+(clLeft(j)>1?'s are':' is')+' still open.');render();return}
    j[f]=el.value;
    if(f==='custId'||f==='locId')j.equip=[];
    if(f==='custId'){j.locId=(S.locations.find(l=>l.custId===el.value)||{}).id;j.contractId=(S.contracts.find(k=>k.custId===el.value)||{}).id}
    if(f==='contractId')toast('Pricing now follows '+con(j.contractId).name);
    if(f==='start'||f==='end'){if(!j.end||j.end<j.start)j.end=j.start}
    render()},
  jobTrip:el=>{curJob().trip=el.checked;render()},
  taskStatus:el=>{curJob().tasks.find(t=>t.id===el.dataset.t).status=el.value;render()},
  clCheck:el=>{const c=curJob().checklist.find(x=>x.id===el.dataset.id);c.done=el.checked;c.by=el.checked?actor():'';c.at=el.checked?nowStr():'';const j=curJob();if(j.status==='Complete'&&clLeft(j)&&!j.override){j.status='In progress';toast('Checklist item reopened, so this call is back In progress')}render()},
  clVal:el=>{const c=curJob().checklist.find(x=>x.id===el.dataset.id);c.val=el.value.trim();c.by=actor();c.at=nowStr();const j=curJob();if(j.status==='Complete'&&clLeft(j)&&!j.override){j.status='In progress';toast('Reading cleared, so this call is back In progress')}render()},
  partInv:async el=>{const f=el.files[0];if(!f)return;const p=curJob().parts.find(x=>x.id===el.dataset.id);p.invoice=await readAtt(f);toast('Invoice attached');render()},
  photoUp:async el=>{const j=curJob();for(const f of el.files){const a=await readAtt(f);j.photos.push({id:uid('ph'),src:a.src,name:a.name,phase:'During',cap:'',by:actor(),at:nowStr()})}toast(el.files.length+' photo'+(el.files.length>1?'s':'')+' added');render()},
  phPhase:el=>{curJob().photos.find(p=>p.id===el.dataset.id).phase=el.value},
  phCap:el=>{curJob().photos.find(p=>p.id===el.dataset.id).cap=el.value},
  pmBasis:el=>{con(el.dataset.id).pm.basis=el.value;render()},pmLoc:el=>{const p=con(el.dataset.id).pm;if(el.value==='')delete p.locPrices[el.dataset.loc];else p.locPrices[el.dataset.loc]=parseFloat(el.value)||0;toast('PM price saved')},pmDefault:el=>{con(el.dataset.id).pm.locDefault=parseFloat(el.value)||0;toast('PM price saved')},pmEq:el=>{con(el.dataset.id).pm.eqPrices[el.dataset.type]=parseFloat(el.value)||0;render()},jobPmParts:el=>{curJob().pmParts=el.checked;render()},
  conMethod:el=>{con(el.dataset.id).method=el.value;toast('Billing method updated');render()},empCost:el=>{emp(el.dataset.id).cost=parseFloat(el.value)||0;toast('Cost rate updated')},jobPrice:el=>{curJob().fixedPrice=parseFloat(el.value)||0;render()},
  billField:el=>{S.bill[el.dataset.f]=el.value;S.bill.out='';render()},billFmt:el=>{S.bill.fmt=el.value;S.bill.out='';render()},
  jobEquip:el=>{const j=curJob(),i=j.equip.indexOf(el.dataset.id);if(el.checked&&i<0)j.equip.push(el.dataset.id);if(!el.checked&&i>=0)j.equip.splice(i,1);render()},
  partFilter:el=>{S.partFilter=el.value;render()},
  tplName:el=>{S.templates.find(t=>t.id===S.tplSel).name=el.value.trim()||'Untitled';render()},
  njKind:el=>{capNJ();S.modal.kind=el.value;render()},
  njCust:el=>{capNJ();S.modal.custId=el.value;render()},
  impFile:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp-text').value=r.result;if(!val('imp-name'))$('#imp-name').value=f.name.replace(/\.[^.]+$/,'')};r.readAsText(f)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&acts[el.dataset.act])acts[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&chg[el.dataset.chg])chg[el.dataset.chg](el)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.drawer){S.drawer=null;render()}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&acts[e.target.dataset.enter]){e.preventDefault();acts[e.target.dataset.enter](e.target)}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c)e.dataTransfer.setData('text/plain',c.dataset.drag)});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();
  const key=e.dataTransfer.getData('text/plain');if(!key)return;
  const {j,o,tid}=targetOf(key),em=c.dataset.emp,d=c.dataset.date;
  if(!o.assignees.includes(em))o.assignees.push(em);
  if(!o.start){o.start=d;o.end=d}else{if(d<o.start)o.start=d;if(d>o.end)o.end=d}
  if(!tid){if(!o.lead)o.lead=em;if(o.status==='Unassigned')o.status='Scheduled'}
  toast(emp(em).name+' assigned to '+j.id+' on '+fmtD(d));render()});
render();
</script>
